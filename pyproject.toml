[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tender-intelligence"
version = "0.1.0"
description = "Local API and worker foundation for AI Tender Intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "httpcore>=1.0.9,<2",
    "pypdf==6.21.4",
    "olefile==0.47",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
ai-tender-beta = "ai_tender_intelligence.beta67.__main__:main"
ai-tender-setup = "ai_tender_intelligence.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires the explicitly configured disposable local PostgreSQL test database"]

[tool.setuptools.data-files]
"share/ai-tender-intelligence/prompts" = ["prompts/luna_cpv_classification.md", "prompts/luna_evidence_verification.md", "prompts/luna_evidence_verification_v3.md", "prompts/shared_rules.md", "prompts/sol_evidence_shortrefs37.md", "prompts/sol_internal54.md", "prompts/sol_processing58.md", "prompts/sol_tender_report.md", "prompts/submission_evidence_v4.md", "prompts/submission_references_v5.md", "prompts/terra_beta59.md", "prompts/terra_bulgarian_email_p40.md", "prompts/terra_bulgarian_email_v2.md", "prompts/terra_internal54.md", "prompts/terra_report_v1.md"]
"share/ai-tender-intelligence/reference-data/cpv/2008" = ["reference-data/cpv/2008/PROVENANCE.json", "reference-data/cpv/2008/PROVENANCE.md", "reference-data/cpv/2008/cpv_2008.xml"]
"share/ai-tender-intelligence/migrations" = ["migrations/env.py", "migrations/script.py.mako"]
"share/ai-tender-intelligence/migrations/beta" = ["migrations/beta/0001_remove_lifetime_analysis_limit.sql"]
"share/ai-tender-intelligence/migrations/versions" = ["migrations/versions/0001_profiles.py", "migrations/versions/0001_profiles.sql", "migrations/versions/0002_classification.py", "migrations/versions/0003_prompts.py", "migrations/versions/0004_searches.py"]
"share/ai-tender-intelligence/discovery_migrations" = ["discovery_migrations/env.py"]
"share/ai-tender-intelligence/discovery_migrations/versions" = ["discovery_migrations/versions/d0001_discovery.py"]
"share/ai-tender-intelligence/document_migrations" = ["document_migrations/env.py"]
"share/ai-tender-intelligence/document_migrations/versions" = ["document_migrations/versions/e0001_documents.py"]
"share/ai-tender-intelligence/extraction_migrations" = ["extraction_migrations/env.py"]
"share/ai-tender-intelligence/extraction_migrations/versions" = ["extraction_migrations/versions/x0001_extractions.py"]
"share/ai-tender-intelligence" = ["alembic.ini"]
